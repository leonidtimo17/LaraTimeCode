name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            laravel: "12"
            testbench: "^10.0"
            phpunit: "^11.5"
          - php: "8.3"
            laravel: "12"
            testbench: "^10.0"
            phpunit: "^11.5"
          - php: "8.3"
            laravel: "13"
            testbench: "^11.0"
            phpunit: "^12.0"
          - php: "8.5"
            laravel: "13"
            testbench: "^11.0"
            phpunit: "^12.0"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select Laravel test matrix
        run: >-
          composer require --dev
          "orchestra/testbench:${{ matrix.testbench }}"
          "phpunit/phpunit:${{ matrix.phpunit }}"
          --no-interaction
          --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
