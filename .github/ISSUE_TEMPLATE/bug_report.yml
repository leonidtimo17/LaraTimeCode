name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload a production `.repro` file. Create a minimal sanitized example.
        Report security vulnerabilities privately according to `SECURITY.md`.
  - type: input
    id: version
    attributes:
      label: LaraTimeCode version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: PHP, Laravel, operating system, and database versions.
      placeholder: PHP 8.3, Laravel 12, Ubuntu 24.04, PostgreSQL 17
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include sanitized configuration and the smallest safe code example.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and personal data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
